name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  AWS_REGION: us-east-1

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck
        continue-on-error: true

      - name: Upload SPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          retention-days: 1
          path: |
            apps/customer-kiosk/dist/
            apps/employee-register/dist/
            apps/office-dashboard/dist/

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-bundle
          retention-days: 1
          path: |
            services/api/src/
            services/api/package.json
            services/api/tsconfig.json
            services/api/tsconfig.build.json
            services/api/Dockerfile
            packages/shared/src/
            packages/shared/package.json
            packages/shared/tsconfig.json
            packages/ui/package.json
            apps/customer-kiosk/package.json
            apps/employee-register/package.json
            apps/office-dashboard/package.json
            docker-compose.prod.yml
            .dockerignore
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig.base.json


  deploy-spas:
    name: Deploy SPAs to S3 + CloudFront
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Download SPA artifacts
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: apps/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Customer Kiosk
        run: |
          aws s3 sync apps/customer-kiosk/dist/ \
            s3://${{ vars.S3_CUSTOMER_KIOSK }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/customer-kiosk/dist/index.html \
            s3://${{ vars.S3_CUSTOMER_KIOSK }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_CUSTOMER_KIOSK }} \
            --paths "/*"

      - name: Deploy Employee Register
        run: |
          aws s3 sync apps/employee-register/dist/ \
            s3://${{ vars.S3_EMPLOYEE_REGISTER }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/employee-register/dist/index.html \
            s3://${{ vars.S3_EMPLOYEE_REGISTER }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_EMPLOYEE_REGISTER }} \
            --paths "/*"

      - name: Deploy Office Dashboard
        run: |
          aws s3 sync apps/office-dashboard/dist/ \
            s3://${{ vars.S3_OFFICE_DASHBOARD }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/office-dashboard/dist/index.html \
            s3://${{ vars.S3_OFFICE_DASHBOARD }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_OFFICE_DASHBOARD }} \
            --paths "/*"

  deploy-api:
    name: Deploy API to Production
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-bundle
          path: .

      - name: Build Docker image in CI
        run: |
          docker build -t the-clubs-api:latest -f services/api/Dockerfile .
          docker save the-clubs-api:latest | gzip > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Copy image + compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "api-image.tar.gz,docker-compose.prod.yml"
          target: /home/ec2-user/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD
          command_timeout: 10m
          script: |
            set -e

            # Load pre-built image
            echo "Loading Docker image..."
            docker load < /home/ec2-user/api-image.tar.gz
            rm /home/ec2-user/api-image.tar.gz

            # Move compose file into place
            mkdir -p /home/ec2-user/the-clubs
            mv /home/ec2-user/docker-compose.prod.yml /home/ec2-user/the-clubs/
            cd /home/ec2-user/the-clubs

            # Create .env if it doesn't exist
            if [ ! -f /home/ec2-user/.env ]; then
              cat > /home/ec2-user/.env << EOF
            DB_NAME=club_operations
            DB_USER=clubops
            DB_PASSWORD=${DB_PASSWORD}
            CORS_ORIGINS=*
            EOF
            fi

            # Start/restart containers (no --build, image already loaded)
            docker compose -f docker-compose.prod.yml \
              --env-file /home/ec2-user/.env \
              up -d

            # Health check
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✓ API is healthy!"
                exit 0
              fi
              echo "  Attempt $i/30 - waiting..."
              sleep 2
            done

            echo "✗ Health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 api
            docker compose -f docker-compose.prod.yml logs --tail=50 db
            exit 1

  notify-deployment:
    name: Notify Deployment Status
    if: always()
    needs: [deploy-api, deploy-spas]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy-api.result }}" == "success" ] && [ "${{ needs.deploy-spas.result }}" == "success" ]; then
            echo "✓ Deployment to production succeeded!"
            exit 0
          else
            echo "✗ Deployment to production failed!"
            exit 1
          fi
