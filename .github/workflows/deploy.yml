name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write   # Required for OIDC federation with AWS

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  AWS_REGION: us-east-1

jobs:
  # ─────────────────────────────────────────────
  # Build & Test (runs on every push and PR)
  # ─────────────────────────────────────────────
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck
        continue-on-error: true

      # Upload built assets for deploy jobs
      - name: Upload SPA artifacts
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          retention-days: 1
          path: |
            apps/customer-kiosk/dist/
            apps/employee-register/dist/
            apps/office-dashboard/dist/

      - name: Upload API artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: api-bundle
          retention-days: 1
          path: |
            services/api/
            packages/shared/
            docker-compose.prod.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  # ─────────────────────────────────────────────
  # Deploy SPAs to S3 + CloudFront (main only)
  # ─────────────────────────────────────────────
  deploy-spas:
    name: Deploy SPAs
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download SPA artifacts
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: apps/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Customer Kiosk
        run: |
          aws s3 sync apps/customer-kiosk/dist/ \
            s3://${{ vars.S3_CUSTOMER_KIOSK }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/customer-kiosk/dist/index.html \
            s3://${{ vars.S3_CUSTOMER_KIOSK }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_CUSTOMER_KIOSK }} \
            --paths "/*"

      - name: Deploy Employee Register
        run: |
          aws s3 sync apps/employee-register/dist/ \
            s3://${{ vars.S3_EMPLOYEE_REGISTER }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/employee-register/dist/index.html \
            s3://${{ vars.S3_EMPLOYEE_REGISTER }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_EMPLOYEE_REGISTER }} \
            --paths "/*"

      - name: Deploy Office Dashboard
        run: |
          aws s3 sync apps/office-dashboard/dist/ \
            s3://${{ vars.S3_OFFICE_DASHBOARD }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/office-dashboard/dist/index.html \
            s3://${{ vars.S3_OFFICE_DASHBOARD }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_OFFICE_DASHBOARD }} \
            --paths "/*"

  # ─────────────────────────────────────────────
  # Deploy API to EC2 (main only)
  # ─────────────────────────────────────────────
  deploy-api:
    name: Deploy API
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-bundle
          path: api-bundle/

      - name: Package API for transfer
        run: tar -czf api-bundle.tar.gz -C api-bundle .

      - name: Copy API bundle to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: api-bundle.tar.gz
          target: /home/ec2-user/

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            set -e
            APP_DIR="/home/ec2-user/the-clubs"

            # Unpack the bundle
            mkdir -p "$APP_DIR"
            tar -xzf /home/ec2-user/api-bundle.tar.gz -C "$APP_DIR"
            rm /home/ec2-user/api-bundle.tar.gz

            cd "$APP_DIR"

            # Ensure Docker Buildx is up to date
            BUILDX_VERSION="0.21.2"
            if ! docker buildx version 2>/dev/null | grep -q "$BUILDX_VERSION"; then
              mkdir -p ~/.docker/cli-plugins
              curl -sSL "https://github.com/docker/buildx/releases/download/v${BUILDX_VERSION}/buildx-v${BUILDX_VERSION}.linux-amd64" -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
            fi

            # Create .env if it doesn't exist
            if [ ! -f /home/ec2-user/.env ]; then
              cat > /home/ec2-user/.env << EOF
            DB_NAME=club_operations
            DB_USER=clubops
            DB_PASSWORD=${DB_PASSWORD}
            CORS_ORIGINS=*
            EOF
            fi

            # Rebuild and restart
            docker compose -f docker-compose.prod.yml \
              --env-file /home/ec2-user/.env \
              up -d --build

            # Health check
            echo "Waiting for API health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "API is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker compose -f docker-compose.prod.yml logs --tail=50 api
            exit 1
