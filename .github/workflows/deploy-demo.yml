name: Deploy to Demo

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  AWS_REGION: us-east-1
  DEMO_API_URL: https://api-demo.joshuakessell.com

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages (demo API endpoint)
        env:
          VITE_API_BASE_URL: ${{ env.DEMO_API_URL }}
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck
        continue-on-error: true

      - name: Upload SPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-spa-dist
          retention-days: 1
          path: |
            apps/customer-kiosk/dist/
            apps/employee-register/dist/
            apps/office-dashboard/dist/

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-api-bundle
          retention-days: 1
          path: |
            services/api/src/
            services/api/migrations/
            services/api/package.json
            services/api/tsconfig.json
            services/api/tsconfig.build.json
            services/api/Dockerfile
            packages/shared/src/
            packages/shared/package.json
            packages/shared/tsconfig.json
            packages/ui/package.json
            apps/customer-kiosk/package.json
            apps/employee-register/package.json
            apps/office-dashboard/package.json
            docker-compose.prod.yml
            .dockerignore
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            tsconfig.base.json

  deploy-demo-spas:
    name: Deploy Demo SPAs to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download SPA artifacts
        uses: actions/download-artifact@v4
        with:
          name: demo-spa-dist
          path: apps/

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Demo Employee Register
        run: |
          aws s3 sync apps/employee-register/dist/ \
            s3://${{ vars.S3_DEMO_EMPLOYEE_REGISTER }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/employee-register/dist/index.html \
            s3://${{ vars.S3_DEMO_EMPLOYEE_REGISTER }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DEMO_EMPLOYEE_REGISTER }} \
            --paths "/*"

      - name: Deploy Demo Customer Kiosk
        run: |
          aws s3 sync apps/customer-kiosk/dist/ \
            s3://${{ vars.S3_DEMO_CUSTOMER_KIOSK }} --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          aws s3 cp apps/customer-kiosk/dist/index.html \
            s3://${{ vars.S3_DEMO_CUSTOMER_KIOSK }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DEMO_CUSTOMER_KIOSK }} \
            --paths "/*"

  deploy-demo-api:
    name: Deploy API to Demo (Staging EC2)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-api-bundle
          path: .

      - name: Build Docker image in CI
        run: |
          docker build -t the-clubs-api:latest -f services/api/Dockerfile .
          docker save the-clubs-api:latest | gzip > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Copy image + compose to Staging EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "api-image.tar.gz,docker-compose.prod.yml"
          target: /home/ec2-user/

      - name: Deploy on Staging EC2
        uses: appleboy/ssh-action@v1
        env:
          DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          KIOSK_TOKEN: ${{ secrets.DEMO_KIOSK_TOKEN }}
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,KIOSK_TOKEN
          command_timeout: 10m
          script: |
            set -e

            # Load pre-built image
            echo "Loading Docker image..."
            docker load < /home/ec2-user/api-image.tar.gz
            rm /home/ec2-user/api-image.tar.gz

            # Move compose file into place
            mkdir -p /home/ec2-user/the-clubs
            mv /home/ec2-user/docker-compose.prod.yml /home/ec2-user/the-clubs/
            cd /home/ec2-user/the-clubs

            # Demo .env — full demo mode with auto-seed
            printf '%s\n' \
              'DB_NAME=club_operations' \
              'DB_USER=clubops' \
              'ALLOWED_ORIGINS=*' \
              'DEMO_MODE=true' \
              'SEED_ON_STARTUP=true' \
              "DB_PASSWORD=${DB_PASSWORD}" \
              "KIOSK_TOKEN=${KIOSK_TOKEN}" \
              > /home/ec2-user/.env

            # Start/restart containers
            docker compose -f docker-compose.prod.yml \
              --env-file /home/ec2-user/.env \
              up -d

            echo "✓ Demo containers started"

            # Wait for health
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✓ Demo API is healthy!"
                exit 0
              fi
              sleep 2
            done
            echo "⚠ Health check timeout — check logs"
            docker compose -f docker-compose.prod.yml logs --tail=30 api
            exit 1

  notify-deployment:
    name: Notify Demo Deployment Status
    if: always()
    needs: [deploy-demo-api, deploy-demo-spas]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy-demo-api.result }}" == "success" ] && [ "${{ needs.deploy-demo-spas.result }}" == "success" ]; then
            echo "✓ Demo deployment succeeded!"
            echo "  Employee: https://employee-demo.joshuakessell.com"
            echo "  Customer: https://customer-demo.joshuakessell.com"
            echo "  API:      https://api-demo.joshuakessell.com"
            exit 0
          else
            echo "✗ Demo deployment failed!"
            exit 1
          fi
