# ──────────────────────────────────────────────────────
# Reverse proxy: route by Host header to the correct API
# ──────────────────────────────────────────────────────

server {
    listen 80;
    server_name api.joshuakessell.com;

    # ── SSE / Realtime ──────────────────────────────
    # EventSource connections are long-lived. Nginx must NOT
    # buffer the upstream response, otherwise events queue up
    # and the client never receives them until the buffer flushes
    # or the connection closes.
    location /v1/realtime/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;

        # Disable buffering — stream bytes as they arrive
        proxy_buffering off;
        proxy_cache off;

        # Keep connection open for up to 24h (heartbeats every 30s)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # SSE is NOT a WebSocket upgrade — keep default Connection header
        proxy_set_header Connection '';

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else (REST API) ──────────────────
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api-demo.joshuakessell.com;

    # ── SSE / Realtime ──────────────────────────────
    location /v1/realtime/ {
        proxy_pass http://host.docker.internal:3001;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 86400s;
