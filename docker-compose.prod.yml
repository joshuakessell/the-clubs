
# Production compose — API + PostgreSQL only.
# SPAs are deployed to S3 static hosting (not containerized).

services:
  db:
    image: postgres:15-alpine
    container_name: club-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-club_operations}
      POSTGRES_USER: ${DB_USER:-clubops}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clubops} -d ${DB_NAME:-club_operations}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  api:
    image: the-clubs-api:latest
    container_name: club-ops-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-clubops}:${DB_PASSWORD}@db:5432/${DB_NAME:-club_operations}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      KIOSK_TOKEN: ${KIOSK_TOKEN}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal

volumes:
  postgres_data:
    driver: local

networks:
  internal:
    driver: bridge
